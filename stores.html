<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0F1117">
<title>APM Stores</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--surface:#181C26;--surface2:#1E2333;
  --border:#2A3045;--accent:#D4A017;--accent-lo:#2A2210;
  --txt:#E8EAF0;--txt2:#8A94B0;--txt3:#556080;
  --red:#EF4444;--red-lo:#2D1515;--green:#22C55E;--green-lo:#132A1A;
  --out:#F59E0B;--out-lo:#2D2210;
  --card-radius:14px;
}
html,body{min-height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding:16px 20px 0;max-width:520px;margin:0 auto;display:flex;
  justify-content:space-between;align-items:flex-start;gap:12px}
.logo{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--txt)}
.logo span{color:var(--accent)}
.logo-sub{font-size:12px;color:var(--txt3);margin-top:2px}
.tabs{display:flex;gap:8px;padding:14px 20px 0;max-width:520px;margin:0 auto}
.tab-btn{flex:1;padding:12px 8px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);color:var(--txt2);font-size:14px;font-weight:700;cursor:pointer;
  transition:all .15s}
.tab-btn.in.active{background:var(--green);border-color:var(--green);color:#04210F}
.tab-btn.out.active{background:var(--out);border-color:var(--out);color:#2A1A00}
main{max-width:520px;margin:0 auto;padding:14px 20px 80px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);
  margin-bottom:14px;overflow:hidden}
.card-eyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);padding:14px 18px 0}
.scan-wrap{padding:14px 18px}
.tag-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;padding:14px 16px;color:var(--txt);font-size:22px;font-weight:700;
  text-align:center;letter-spacing:.08em;-webkit-appearance:none;appearance:none;
  outline:none;transition:border-color .15s}
.tag-input:focus{border-color:var(--accent)}
.tag-input::placeholder{color:var(--txt3);font-size:15px;letter-spacing:.02em;font-weight:600}
.hint-line{padding:10px 0 0;font-size:13px;color:var(--txt3)}
.ac-list{display:none;margin-top:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ac-list.show{display:block}
.ac-item{display:block;width:100%;padding:12px 14px;border:none;border-bottom:1px solid var(--border);
  background:var(--surface2);color:var(--txt);text-align:left;cursor:pointer}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.active{background:var(--accent-lo)}
.ac-name{display:block;font-size:15px;font-weight:700}
.ac-meta{display:block;font-size:12px;color:var(--txt3);margin-top:2px}
.info-card{background:var(--accent-lo);border:1px solid var(--accent);
  border-radius:10px;padding:12px 16px;margin-top:10px}
.info-name{font-size:16px;font-weight:800;margin-bottom:4px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.info-row:not(:last-child){border-bottom:1px solid #2A2A1A}
.info-label{color:var(--txt3)}
.info-val{font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums}
.info-warn{margin-top:8px;font-size:13px;font-weight:700;color:var(--red)}
.err-card{background:var(--red-lo);border:1px solid var(--red);border-radius:10px;
  padding:12px 14px;margin-top:10px;color:var(--red);font-size:13px;font-weight:600}
.field-row{display:flex;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border)}
.field-label{font-size:12px;color:var(--txt2);width:96px;flex-shrink:0}
.field-val{flex:1;min-width:0}
.field-input{width:100%;background:transparent;border:none;color:var(--txt);font-size:15px;
  font-weight:600;outline:none;padding:4px 0}
.field-input::placeholder{color:var(--txt3);font-weight:500}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;
  color:var(--txt);cursor:pointer;width:100%}
.check input{width:20px;height:20px;accent-color:var(--green);flex-shrink:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper-val{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--txt);font-size:15px;font-weight:700;text-align:center;padding:7px 10px;
  width:80px;outline:none;-webkit-appearance:none;appearance:none}
.stepper-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--txt);font-size:18px;width:38px;height:38px;cursor:pointer;flex-shrink:0}
.bag-row{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--border)}
.bag-no{font-size:12px;font-weight:700;color:var(--txt2);width:56px;flex-shrink:0}
.bag-row input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--txt);font-size:16px;font-weight:700;padding:9px 12px;
  outline:none;-webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums}
.bag-row input:focus{border-color:var(--green)}
.unit{font-size:12px;color:var(--txt3);width:24px}
.tally{padding:10px 18px;font-size:13px;color:var(--txt2);border-bottom:1px solid var(--border);
  font-variant-numeric:tabular-nums}
.tally strong{color:var(--green)}
.pick-title{font-size:12px;font-weight:700;color:var(--txt2);margin:14px 0 2px;
  text-transform:uppercase;letter-spacing:.06em}
.bag-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:12px 14px;margin-top:8px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface2);color:var(--txt);font-size:14px;text-align:left;cursor:pointer}
.bag-pick.sel{border-color:var(--out);background:var(--out-lo)}
.bp-id{display:block;font-weight:800;letter-spacing:.04em}
.bp-meta{display:block;font-size:12px;color:var(--txt3);margin-top:2px}
.bp-wt{font-weight:800;color:var(--out);white-space:nowrap;font-variant-numeric:tabular-nums}
.sel-line{padding:12px 18px;font-size:13px;color:var(--txt2);border-bottom:1px solid var(--border)}
.sel-line strong{color:var(--txt)}
.btn-save{width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;
  color:#000;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.02em;margin-top:4px}
.btn-save.in{background:var(--green);color:#04210F}
.btn-save.out{background:var(--out);color:#2A1A00}
.btn-save:disabled{opacity:.45;cursor:not-allowed}
.btn-cancel{width:100%;padding:12px;background:transparent;border:1px solid var(--border);
  border-radius:12px;color:var(--txt2);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.done{border:1px solid;border-radius:var(--card-radius);padding:14px 18px;margin-bottom:14px}
.done.in{background:var(--green-lo);border-color:var(--green)}
.done.out{background:var(--out-lo);border-color:var(--out)}
.done-title{font-size:15px;font-weight:800}
.done.in .done-title{color:var(--green)}
.done.out .done-title{color:var(--out)}
.done-line{font-size:13px;color:var(--txt2);margin-top:4px;font-variant-numeric:tabular-nums}
/* Scanner */
.scan-row{display:flex;gap:8px}
.scan-row .tag-input{flex:1;min-width:0}
.scan-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--txt2);padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.scan-btn svg{width:18px;height:18px}
.scanner-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.scanner-overlay.open{opacity:1;pointer-events:auto}
.scanner-box{width:100%;background:var(--surface);border-radius:20px 20px 0 0;
  padding:20px 20px 40px;display:flex;flex-direction:column;gap:16px}
.scanner-top{display:flex;align-items:center;justify-content:space-between}
.scanner-top span{font-size:15px;font-weight:700;color:var(--txt)}
.scanner-top button{background:var(--surface2);border:none;color:var(--txt2);
  width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.scanner-viewport{position:relative;width:100%;aspect-ratio:1;border-radius:12px;
  overflow:hidden;background:#000}
#scanVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scanCanvas{display:none}
.scan-frame{position:absolute;inset:24px;pointer-events:none}
.corner{position:absolute;width:24px;height:24px;border-color:var(--accent);border-style:solid}
.corner.tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.corner.tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.corner.bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.corner.br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-beam{position:absolute;left:0;right:0;height:2px;background:var(--accent);
  box-shadow:0 0 8px var(--accent);top:0;animation:beamScan 2s ease-in-out infinite}
@keyframes beamScan{0%{top:0%}50%{top:100%}100%{top:0%}}
.scan-hint-overlay{text-align:center;color:var(--txt2);font-size:13px}
@media (prefers-reduced-motion:reduce){.scan-beam{animation:none;top:50%}.tab-btn{transition:none}}
/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);
  background:#1E2333;border:1px solid var(--border);color:var(--txt);
  padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;transition:all .25s;z-index:999;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<!-- Hidden fallback input — opens native camera when getUserMedia is blocked -->
<input type="file" id="photoInput" accept="image/*" capture="environment"
       style="display:none" onchange="Scanner.onPhotoCapture(this)">

<!-- CAMERA SCANNER OVERLAY -->
<div class="scanner-overlay" id="scanOverlay">
  <div class="scanner-box">
    <div class="scanner-top">
      <span id="scanTitle">Scan label</span>
      <button onclick="Scanner.stop()" aria-label="Close scanner">✕</button>
    </div>
    <div class="scanner-viewport">
      <video id="scanVideo" playsinline autoplay muted></video>
      <canvas id="scanCanvas"></canvas>
      <div class="scan-frame">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="scan-beam"></div>
      </div>
    </div>
    <p class="scan-hint-overlay">Hold steady — detects automatically</p>
  </div>
</div>

<!-- ══════ APP ══════ -->
<div id="appView">
  <header>
    <div>
      <div class="logo">APM <span>Stores</span></div>
      <div class="logo-sub">Stock In · Stock Out</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn in"  id="tabIn"  onclick="showTab('in')">⬇ Stock In</button>
    <button class="tab-btn out" id="tabOut" onclick="showTab('out')">⬆ Stock Out</button>
  </div>

  <!-- ══════ STOCK IN ══════ -->
  <main id="inPane">
    <div id="inDone"></div>

    <div class="card">
      <div class="card-eyebrow">Step 1 — Scan or search item</div>
      <div class="scan-wrap">
        <div class="scan-row">
          <input id="inCode" class="tag-input" type="text" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" placeholder="Item code or name"
                 oninput="In.onCode(this.value)">
          <button class="scan-btn" onclick="Scanner.start('in')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
              <rect x="7" y="7" width="10" height="10" rx="1"/>
            </svg>
            Scan
          </button>
        </div>
        <div id="inInfo"></div>
      </div>
    </div>

    <div class="card" id="inForm" style="display:none">
      <div class="card-eyebrow">Step 2 — Quantity &amp; details</div>
      <div class="field-row" id="inBagsToggleRow">
        <label class="check"><input type="checkbox" id="inUseBags" onchange="In.toggleBags()">
          Material is in bags (one label per bag)</label>
      </div>
      <div id="inBagsBox">
        <div class="field-row">
          <div class="field-label">No. of bags</div>
          <div class="field-val">
            <div class="stepper">
              <input class="stepper-val" id="inBagCount" type="number" inputmode="numeric"
                     min="1" max="50" value="1" oninput="In.renderBags()">
              <button class="stepper-btn" onclick="In.stepBags(-1)" aria-label="One bag less">−</button>
              <button class="stepper-btn" onclick="In.stepBags(1)" aria-label="One bag more">+</button>
            </div>
          </div>
        </div>
        <div id="inBagRows"></div>
        <div class="tally" id="inBagTotal"></div>
      </div>
      <div class="field-row" id="inQtyRow">
        <div class="field-label" id="inQtyLabel">Quantity</div>
        <div class="field-val"><input class="field-input" id="inQty" type="number"
             inputmode="decimal" step="any" min="0" placeholder="0"></div>
      </div>
      <div class="field-row">
        <div class="field-label">Supplier</div>
        <div class="field-val"><input class="field-input" id="inParty" placeholder="Supplier / party"></div>
      </div>
      <div class="field-row">
        <div class="field-label">Challan No.</div>
        <div class="field-val"><input class="field-input" id="inRef" placeholder="DC / challan / PO no."></div>
      </div>
      <div class="field-row">
        <div class="field-label">Remarks</div>
        <div class="field-val"><input class="field-input" id="inRemarks" placeholder="Optional"></div>
      </div>
      <div class="field-row">
        <div class="field-label">Your Name</div>
        <div class="field-val"><input class="field-input" id="inUser" placeholder="Who is receiving" autocomplete="name"></div>
      </div>
      <div style="padding:14px 18px">
        <button class="btn-save in" id="inSave" onclick="In.save()">Save Stock In</button>
        <button class="btn-cancel" onclick="In.reset()">Cancel</button>
      </div>
    </div>
  </main>

  <!-- ══════ STOCK OUT ══════ -->
  <main id="outPane" style="display:none">
    <div id="outDone"></div>

    <div class="card">
      <div class="card-eyebrow">Step 1 — Scan bag or search item</div>
      <div class="scan-wrap">
        <div class="scan-row">
          <input id="outCode" class="tag-input" type="text" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" placeholder="Bag code, item code or name"
                 oninput="Out.onCode(this.value)">
          <button class="scan-btn" onclick="Scanner.start('out')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
              <rect x="7" y="7" width="10" height="10" rx="1"/>
            </svg>
            Scan
          </button>
        </div>
        <div id="outInfo"></div>
        <div id="outBags"></div>
      </div>
    </div>

    <div class="card" id="outForm" style="display:none">
      <div class="card-eyebrow">Step 2 — Issue</div>
      <div class="sel-line" id="outSel"></div>
      <div class="field-row">
        <div class="field-label" id="outQtyLabel">Quantity</div>
        <div class="field-val"><input class="field-input" id="outQty" type="number"
             inputmode="decimal" step="any" min="0" placeholder="0"></div>
      </div>
      <div class="field-row">
        <div class="field-label">Issued To</div>
        <div class="field-val"><input class="field-input" id="outParty" placeholder="Person / department"></div>
      </div>
      <div class="field-row">
        <div class="field-label">Job No.</div>
        <div class="field-val"><input class="field-input" id="outRef" placeholder="Job / work order no."></div>
      </div>
      <div class="field-row">
        <div class="field-label">Remarks</div>
        <div class="field-val"><input class="field-input" id="outRemarks" placeholder="Optional"></div>
      </div>
      <div class="field-row">
        <div class="field-label">Your Name</div>
        <div class="field-val"><input class="field-input" id="outUser" placeholder="Who is issuing" autocomplete="name"></div>
      </div>
      <div style="padding:14px 18px">
        <button class="btn-save out" id="outSave" onclick="Out.save()">Save Stock Out</button>
        <button class="btn-cancel" onclick="Out.reset()">Cancel</button>
      </div>
    </div>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// Inventory backend (gas-inventory web app, doPost worker API) and the label printer pipeline (gas-project).
const INV_API   = 'https://script.google.com/macros/s/AKfycbxDeKxI1rxckSq8kMr1FQCbnpHVJleQUcBsQ0bx3CcHhKZ3zujJH9YmU_A3-dkAYsGx/exec';
const LABEL_API = 'https://script.google.com/a/macros/apmindustries.in/s/AKfycbzwczRq8RgUAoR6TPP-1yy77JE-fJYbC3vcNq7vW2gapr8o-YOxU0wT30lHz-raNL8K/exec';

const el    = id => document.getElementById(id);
const esc   = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt   = n => Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 3 });
const bagNo = id => String(id).replace(/^[^0-9]*/, '');
const same  = (a, b) => String(a).trim().toUpperCase() === String(b).trim().toUpperCase();
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} },
};

function today() {
  const d = new Date();
  return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
}

let _toastTimer;
function toast(msg, type) {
  const t = el('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = ''; }, 3500);
}

function errCard(msg) { return '<div class="err-card">⚠ ' + esc(msg) + '</div>'; }
function infoRow(label, val) {
  return '<div class="info-row"><span class="info-label">' + label + '</span><span class="info-val">' + val + '</span></div>';
}
function itemCard(it) {
  return '<div class="info-card"><div class="info-name">' + esc(it.name) + '</div>' +
    infoRow('Code', esc(bagNo(it.code) || it.code)) +
    infoRow('In stock', fmt(it.current) + ' ' + esc(it.uom)) +
    (it.location ? infoRow('Location', esc(it.location)) : '') +
    (it.status !== 'ACTIVE' ? '<div class="info-warn">This item is inactive. Ask the office.</div>' : '') +
    '</div>';
}
function doneCard(kind, lines, statusId) {
  return '<div class="done ' + kind + '"><div class="done-title">✓ ' + (kind === 'in' ? 'Stock In saved' : 'Stock Out saved') + '</div>' +
    lines.map(l => '<div class="done-line">' + l + '</div>').join('') +
    (statusId ? '<div class="done-line" id="' + statusId + '"></div>' : '') + '</div>';
}

// ══════════════════════════════════════════════════════
// SERVER + WORKER NAME (remembered on this phone)
// ══════════════════════════════════════════════════════
async function api(action, data) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const r = await fetch(INV_API, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action }, data || {})),
      signal: ctrl.signal,
    });
    return await r.json();
  } catch (e) {
    return { error: e.name === 'AbortError'
      ? 'The server did not answer. Check the internet and try again.'
      : 'Could not reach the server. Check the internet and try again.' };
  } finally {
    clearTimeout(timer);
  }
}

function workerName(inputId) {
  const name = el(inputId).value.trim();
  if (!name) { toast('Enter your name.', 'err'); el(inputId).focus(); }
  return name;
}

function rememberName(name) {
  store.set('apmStoresUser', name);
  el('inUser').value = name;
  el('outUser').value = name;
}

function showTab(t) {
  el('inPane').style.display  = t === 'in'  ? '' : 'none';
  el('outPane').style.display = t === 'out' ? '' : 'none';
  el('tabIn').classList.toggle('active', t === 'in');
  el('tabOut').classList.toggle('active', t === 'out');
  store.set('apmStoresTab', t);
}

// ══════════════════════════════════════════════════════
// CAMERA SCANNER (same as the factory-scan pages)
// ══════════════════════════════════════════════════════
const Scanner = (() => {
  let _stream = null, _scanning = false, _target = 'in';

  async function start(target) {
    _target = target;
    el('scanTitle').textContent = target === 'in' ? 'Scan item label' : 'Scan bag or item label';
    el('scanOverlay').classList.add('open');
    try {
      _stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
        audio: false,
      });
      _scanning = true;
      const video = el('scanVideo');
      video.srcObject = _stream;
      await video.play();
      requestAnimationFrame(scanFrame);
    } catch (err) {
      stop();
      el('photoInput').click();
    }
  }

  function scanFrame() {
    if (!_scanning) return;
    const video = el('scanVideo'), canvas = el('scanCanvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data.trim()) { stop(); onScanned(code.data.trim()); return; }
    }
    requestAnimationFrame(scanFrame);
  }

  function stop() {
    _scanning = false;
    if (_stream) { _stream.getTracks().forEach(t => t.stop()); _stream = null; }
    el('scanOverlay').classList.remove('open');
  }

  function onPhotoCapture(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = el('scanCanvas');
      let code = null;
      for (const maxW of [800, 1200, 500]) {
        const s = Math.min(1, maxW / img.width);
        canvas.width = Math.round(img.width * s);
        canvas.height = Math.round(img.height * s);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        code = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
        if (code && code.data.trim()) break;
      }
      if (code && code.data.trim()) onScanned(code.data.trim());
      else toast('No QR code found in the photo. Try again.', 'err');
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Could not read the photo.', 'err'); };
    img.src = url;
  }

  function onScanned(code) {
    if (navigator.vibrate) navigator.vibrate(60);
    (_target === 'in' ? In : Out).setCode(code);
  }

  return { start, stop, onPhotoCapture };
})();

// ══════════════════════════════════════════════════════
// BAG LABELS → BARCODE PRINTER folder (gas-project renders the PDF)
// ══════════════════════════════════════════════════════
// All labels of one Stock In go out as ONE PDF, however many there are. Up to 25 fit in a single request; more are
// built in parts of 25 on the server (start, add, finish) because Apps Script stops any one request after 6 minutes.
const LABEL_PART = 25;

async function labelApi(body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 300000);
  try {
    const r = await fetch(LABEL_API, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal });
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

async function makeLabelPdf(labels, onProgress) {
  if (labels.length <= LABEL_PART) {
    const d = await labelApi({ action: 'generateBagLabels', bags: labels });
    if (!d.ok) throw new Error(d.error || 'failed');
    return;
  }
  const first = labels[0].bagId, last = labels[labels.length - 1].bagId;
  const job = await labelApi({ action: 'bagLabelsStart', firstBag: first });
  if (!job.ok) throw new Error(job.error || 'could not start');
  for (let i = 0; i < labels.length; i += LABEL_PART) {
    onProgress(i, labels.length);
    const part = { action: 'bagLabelsAdd', presId: job.presId, start: i, bags: labels.slice(i, i + LABEL_PART) };
    let r;
    try {
      r = await labelApi(part);
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      await new Promise(done => setTimeout(done, 3000));
      r = await labelApi(part);   // connection dropped: repeating a part is safe, the server discards a half-finished attempt
    }
    if (!r.ok) throw new Error(r.error || 'failed');
  }
  onProgress(labels.length, labels.length);
  const f = await labelApi({ action: 'bagLabelsFinish', presId: job.presId, count: labels.length, firstBag: first, lastBag: last });
  if (!f.ok) throw new Error(f.error || 'failed');
}

function labelError(e) {
  if (e.name === 'AbortError')  return 'the server took too long';
  if (e instanceof TypeError)   return 'no connection';
  if (e instanceof SyntaxError) return 'unexpected reply from the label server';
  return e.message;
}

async function sendLabels(labels, statusEl) {
  const n = labels.length;
  statusEl.textContent = '🖨 Making label PDF (' + n + ' label' + (n === 1 ? '' : 's') + ')…';
  try {
    await makeLabelPdf(labels, (done, total) => { statusEl.textContent = '🖨 Making label PDF… ' + done + ' of ' + total; });
    statusEl.textContent = '🖨 ' + n + ' label' + (n === 1 ? '' : 's') + ' sent to the printer as one PDF ✓';
  } catch (e) {
    statusEl.textContent = '⚠ Labels failed (' + labelError(e) + '). Ask the office to reprint them from the Labels tab.';
  }
}

// ══════════════════════════════════════════════════════
// ITEM SEARCH (type part of a name or code, pick from the list)
// ══════════════════════════════════════════════════════
const dispCode = c => String(c).replace(/^[^0-9]*/, '') || String(c);
const codeKey  = c => String(c).toUpperCase().replace(/^[^0-9]*/, '').replace(/^0+/, '') || '0';

let _itemsP = null, _itemsAt = 0;
function itemList() {
  if (!_itemsP || Date.now() - _itemsAt > 120000) {
    _itemsAt = Date.now();
    _itemsP = api('items').then(d => { if (!d.items) _itemsAt = 0; return d.items || null; });
  }
  return _itemsP;
}

// While typing, only look up a complete bag ID or an existing item code; names show the list instead.
async function isCode(text) {
  const t = String(text).trim().toUpperCase();
  if (/^BCH-\d{5}$/.test(t)) return true;
  const codeLike = /^[A-Z]*-?\d+$/.test(t);
  const items = await itemList();
  if (!items) return codeLike;
  return items.some(it => {
    const c = String(it.code).toUpperCase();
    return c === t || (codeLike && codeKey(c) === codeKey(t));
  });
}

function matchItems(items, q) {
  q = String(q).trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/);
  return items.map(it => {
    const name = String(it.name).toLowerCase(), code = String(it.code).toLowerCase();
    const hay = name + ' ' + code + ' ' + String(it.category || '').toLowerCase();
    if (!words.every(w => hay.includes(w))) return null;
    const s = (code === q || dispCode(code) === q) ? 0 : name.startsWith(q) ? 1 : name.includes(q) ? 2 : 3;
    return { it, s };
  }).filter(Boolean)
    .sort((a, b) => a.s - b.s || String(a.it.name).localeCompare(String(b.it.name)))
    .slice(0, 8).map(x => x.it);
}

function attachItemSearch(inputId, onPick) {
  const input = el(inputId);
  const list = document.createElement('div');
  let shown = [], active = -1, timer = null;
  list.className = 'ac-list';
  input.parentElement.insertAdjacentElement('afterend', list);

  const hide = () => { shown = []; active = -1; list.innerHTML = ''; list.classList.remove('show'); };
  const render = () => {
    list.innerHTML = shown.map((it, i) =>
      '<button type="button" class="ac-item' + (i === active ? ' active' : '') + '" data-i="' + i + '">' +
      '<span class="ac-name">' + esc(it.name) + '</span>' +
      '<span class="ac-meta">Code ' + esc(dispCode(it.code)) + (it.category ? ' · ' + esc(it.category) : '') + '</span></button>'
    ).join('');
    list.classList.toggle('show', shown.length > 0);
  };
  const pick = i => { const it = shown[i]; if (!it) return; hide(); onPick(String(it.code)); };

  input.addEventListener('focus', () => { itemList(); });
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value;
    if (!q.trim() || /^BCH-/i.test(q.trim())) { hide(); return; }
    timer = setTimeout(async () => {
      const items = await itemList();
      if (input.value !== q) return;
      shown = items ? matchItems(items, q) : [];
      active = -1;
      render();
    }, 200);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (shown.length) pick(active >= 0 ? active : 0);
      else if (input.value.trim()) onPick(input.value.trim());
    } else if (shown.length && e.key === 'ArrowDown') { active = Math.min(shown.length - 1, active + 1); render(); e.preventDefault(); }
    else if (shown.length && e.key === 'ArrowUp')   { active = Math.max(0, active - 1); render(); e.preventDefault(); }
    else if (e.key === 'Escape') hide();
  });
  list.addEventListener('mousedown', e => e.preventDefault());
  list.addEventListener('click', e => { const b = e.target.closest('.ac-item'); if (b) pick(+b.dataset.i); });
  document.addEventListener('click', e => { if (e.target !== input && !list.contains(e.target)) hide(); });
}

// ══════════════════════════════════════════════════════
// STOCK IN
// ══════════════════════════════════════════════════════
const In = (() => {
  let item = null, timer = null;

  function setCode(code) { el('inCode').value = code; clearTimeout(timer); lookup(code); }

  function onCode(v) {
    clearTimeout(timer);
    clearItem();
    if (!v.trim()) return;
    timer = setTimeout(async () => { if (await isCode(v)) lookup(v.trim()); }, 500);
  }

  function clearItem() {
    item = null;
    el('inInfo').innerHTML = '';
    el('inForm').style.display = 'none';
  }

  async function lookup(code) {
    clearItem();
    el('inInfo').innerHTML = '<div class="hint-line">Looking up…</div>';
    const d = await api('lookup', { code });
    if (!same(el('inCode').value, code)) return;          // code changed while waiting
    if (d.error) { el('inInfo').innerHTML = errCard(d.error); return; }
    if (d.bag)   { el('inInfo').innerHTML = errCard('This is a bag label. For Stock In, scan the item label.'); return; }
    el('inInfo').innerHTML = itemCard(d.item);
    if (d.item.status !== 'ACTIVE') return;
    item = d.item;
    const wt = item.mtype === 'WEIGHT';
    el('inBagsToggleRow').style.display = wt ? '' : 'none';
    el('inUseBags').checked = wt;
    el('inBagCount').value = 1;
    el('inBagRows').innerHTML = '';
    el('inQty').value = '';
    el('inQtyLabel').textContent = (wt ? 'Weight' : 'Quantity') + ' (' + item.uom + ')';
    toggleBags();
    el('inForm').style.display = '';
  }

  function useBags() { return !!item && item.mtype === 'WEIGHT' && el('inUseBags').checked; }

  function toggleBags() {
    const on = useBags();
    el('inBagsBox').style.display = on ? '' : 'none';
    el('inQtyRow').style.display  = on ? 'none' : '';
    if (on) renderBags();
  }

  function stepBags(d) {
    const i = el('inBagCount');
    i.value = Math.min(50, Math.max(1, (parseInt(i.value, 10) || 1) + d));
    renderBags();
  }

  function bagInputs() { return Array.from(el('inBagRows').querySelectorAll('input')); }

  function renderBags() {
    const countEl = el('inBagCount');
    if (parseInt(countEl.value, 10) > 50) countEl.value = 50;
    const n = Math.min(50, Math.max(1, parseInt(countEl.value, 10) || 1));
    const old = bagInputs().map(i => i.value);
    const uom = item ? item.uom : 'KG';
    let html = '';
    for (let i = 0; i < n; i++) {
      html += '<div class="bag-row"><span class="bag-no">Bag ' + (i + 1) + '</span>' +
        '<input type="number" inputmode="decimal" step="any" min="0" placeholder="Weight" ' +
        'aria-label="Bag ' + (i + 1) + ' weight" value="' + esc(old[i] || '') + '" oninput="In.total()">' +
        '<span class="unit">' + esc(uom) + '</span></div>';
    }
    el('inBagRows').innerHTML = html;
    total();
  }

  function total() {
    const w = bagInputs().map(i => parseFloat(i.value) || 0);
    const sum = Math.round(w.reduce((a, b) => a + b, 0) * 1000) / 1000;
    el('inBagTotal').innerHTML = 'Total: <strong>' + fmt(sum) + ' ' + esc(item ? item.uom : '') + '</strong> in ' +
      w.length + ' bag' + (w.length === 1 ? '' : 's') + ' · each bag gets its own label';
    return { w, sum };
  }

  async function save() {
    if (!item) { toast('Scan the item label first.', 'err'); return; }
    const data = {
      code: item.code,
      party: el('inParty').value.trim(),
      ref: el('inRef').value.trim(),
      remarks: el('inRemarks').value.trim(),
    };
    const bags = useBags();
    let weights = [];
    if (bags) {
      const t = total();
      if (t.w.some(x => !(x > 0))) { toast('Enter the weight of every bag.', 'err'); return; }
      weights = t.w;
      data.qty = t.sum;
      data.bagCount = weights.length;
      data.bagWeights = weights.join(',');
    } else {
      const q = parseFloat(el('inQty').value);
      if (!(q > 0)) { toast('Enter the ' + (item.mtype === 'WEIGHT' ? 'weight' : 'quantity') + '.', 'err'); return; }
      data.qty = q;
    }
    data.user = workerName('inUser');
    if (!data.user) return;

    const btn = el('inSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    const d = await api('stockIn', data);
    btn.disabled = false; btn.textContent = 'Save Stock In';
    if (!d.ok) { toast(d.error || 'Save failed.', 'err'); return; }
    rememberName(data.user);

    const printing = bags && d.bagIds && d.bagIds.length;
    el('inDone').innerHTML = doneCard('in', [
      fmt(data.qty) + ' ' + esc(d.uom) + ' of ' + esc(d.itemName) + (bags ? ' in ' + d.bagIds.length + ' bag' + (d.bagIds.length === 1 ? '' : 's') : ''),
      'New stock: ' + fmt(d.closing) + ' ' + esc(d.uom) + ' · ' + esc(d.txnId),
    ], printing ? 'inLabelStatus' : '');
    toast('Stock In saved ✓', 'ok');
    if (printing) {
      sendLabels(d.bagIds.map((id, i) => ({
        bagId: id, itemName: d.itemName, weight: weights[i], uom: d.uom,
        supplier: data.party, ref: data.ref, received: today(),
      })), el('inLabelStatus'));
    }
    reset(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // keepDelivery: a truck often brings several items on one challan, so keep supplier + challan.
  function reset(keepDelivery) {
    clearTimeout(timer);
    clearItem();
    el('inCode').value = '';
    el('inQty').value = '';
    el('inRemarks').value = '';
    el('inBagRows').innerHTML = '';
    el('inBagCount').value = 1;
    if (keepDelivery !== true) { el('inParty').value = ''; el('inRef').value = ''; }
  }

  return { setCode, onCode, toggleBags, stepBags, renderBags, total, save, reset };
})();

// ══════════════════════════════════════════════════════
// STOCK OUT
// ══════════════════════════════════════════════════════
const Out = (() => {
  let item = null, bag = null, bags = [], timer = null;

  function setCode(code) { el('outCode').value = code; clearTimeout(timer); lookup(code); }

  function onCode(v) {
    clearTimeout(timer);
    clearItem();
    if (!v.trim()) return;
    timer = setTimeout(async () => { if (await isCode(v)) lookup(v.trim()); }, 500);
  }

  function clearItem() {
    item = null; bag = null; bags = [];
    el('outInfo').innerHTML = '';
    el('outBags').innerHTML = '';
    el('outForm').style.display = 'none';
  }

  async function lookup(code) {
    clearItem();
    el('outInfo').innerHTML = '<div class="hint-line">Looking up…</div>';
    const d = await api('lookup', { code });
    if (!same(el('outCode').value, code)) return;         // code changed while waiting
    if (d.error) { el('outInfo').innerHTML = errCard(d.error); return; }
    el('outInfo').innerHTML = itemCard(d.item);
    if (d.item.status !== 'ACTIVE') return;

    if (d.bag) {
      if (d.bag.status !== 'ACTIVE' || !(parseFloat(d.bag.current) > 0)) {
        el('outInfo').innerHTML += errCard('Bag ' + bagNo(d.bag.id) + ' is empty. It was already issued.');
        return;
      }
      item = d.item;
      selectBag(d.bag);
      return;
    }

    item = d.item;
    bags = d.bags || [];
    if (item.mtype === 'WEIGHT' && bags.length) {
      // Bagged material must be issued from a specific bag so bag weights stay correct.
      el('outBags').innerHTML = '<div class="pick-title">Choose the bag you are issuing</div>' +
        bags.map(b =>
          '<button class="bag-pick" data-id="' + esc(b.id) + '" onclick="Out.pick(this.dataset.id)">' +
          '<span><span class="bp-id">Bag ' + esc(bagNo(b.id)) + '</span>' +
          '<span class="bp-meta">' + esc(String(b.date).split(' ')[0]) + (b.supplier ? ' · ' + esc(b.supplier) : '') + '</span></span>' +
          '<span class="bp-wt">' + fmt(b.current) + ' ' + esc(b.uom) + '</span></button>').join('');
      return;
    }
    if (!(parseFloat(item.current) > 0)) { el('outInfo').innerHTML += errCard('No stock left for this item.'); item = null; return; }
    showForm();
  }

  function pick(id) {
    const b = bags.find(x => x.id === id);
    if (b) selectBag(b);
  }

  function selectBag(b) {
    bag = b;
    el('outBags').querySelectorAll('.bag-pick').forEach(x => x.classList.toggle('sel', x.dataset.id === b.id));
    showForm();
  }

  function showForm() {
    el('outSel').innerHTML = bag
      ? 'Issuing from <strong>Bag ' + esc(bagNo(bag.id)) + '</strong> · ' + fmt(bag.current) + ' ' + esc(bag.uom) + ' in the bag'
      : 'Issuing <strong>' + esc(item.name) + '</strong> · ' + fmt(item.current) + ' ' + esc(item.uom) + ' in stock';
    el('outQtyLabel').textContent = (item.mtype === 'WEIGHT' ? 'Weight' : 'Quantity') + ' (' + item.uom + ')';
    el('outQty').value = bag ? bag.current : '';
    el('outForm').style.display = '';
  }

  async function save() {
    if (!item) { toast('Scan a bag or item label first.', 'err'); return; }
    if (item.mtype === 'WEIGHT' && bags.length && !bag) { toast('Choose a bag first.', 'err'); return; }
    const q = parseFloat(el('outQty').value);
    if (!(q > 0)) { toast('Enter the ' + (item.mtype === 'WEIGHT' ? 'weight' : 'quantity') + '.', 'err'); return; }
    if (bag && q > parseFloat(bag.current) + 1e-9) {
      toast('Only ' + fmt(bag.current) + ' ' + bag.uom + ' is left in this bag.', 'err'); return;
    }
    const user = workerName('outUser');
    if (!user) return;

    const btn = el('outSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    const d = await api('stockOut', {
      code: bag ? bag.id : item.code,
      qty: q,
      party: el('outParty').value.trim(),
      ref: el('outRef').value.trim(),
      remarks: el('outRemarks').value.trim(),
      user,
    });
    btn.disabled = false; btn.textContent = 'Save Stock Out';
    if (!d.ok) { toast(d.error || 'Save failed.', 'err'); return; }
    rememberName(user);

    el('outDone').innerHTML = doneCard('out', [
      fmt(d.issued) + ' ' + esc(d.uom) + ' of ' + esc(d.itemName) + (bag ? ' from Bag ' + esc(bagNo(bag.id)) : ''),
      'Stock left: ' + fmt(d.closing) + ' ' + esc(d.uom) + ' · ' + esc(d.txnId),
    ]);
    toast('Stock Out saved ✓', 'ok');
    reset();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function reset() {
    clearTimeout(timer);
    clearItem();
    ['outCode', 'outQty', 'outParty', 'outRef', 'outRemarks'].forEach(id => { el(id).value = ''; });
  }

  return { setCode, onCode, pick, save, reset };
})();

// ══════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════
window.addEventListener('load', () => {
  attachItemSearch('inCode',  code => In.setCode(code));
  attachItemSearch('outCode', code => Out.setCode(code));
  const name = store.get('apmStoresUser');
  el('inUser').value = name;
  el('outUser').value = name;
  showTab(store.get('apmStoresTab') === 'out' ? 'out' : 'in');
});
